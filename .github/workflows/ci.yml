name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests on PostgreSQL 16 + Redis 7)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      # The tests create their own roles and throwaway database through this superuser
      # connection, then run as the non-owner role so RLS is really enforced.
      NEXUS_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NEXUS_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL and Redis from docker-compose.yml
        working-directory: .
        run: docker compose up -d --wait postgres redis

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy (strict)
        run: mypy

      - name: Tests
        run: pytest -q

      - name: Migrations round-trip (upgrade, downgrade to base, upgrade)
        env:
          NEXUS_MIGRATIONS_DATABASE_URL: postgresql+psycopg://nexus_owner:nexus_owner_dev@localhost:5432/nexusai
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: Docker stack end-to-end smoke test
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config -q

      - name: Build and start the full stack
        run: docker compose up -d --build

      - name: Wait for the web app
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/ >/dev/null && exit 0
            sleep 3
          done
          echo "web did not come up"; exit 1

      - name: Smoke test through the BFF
        run: bash scripts/smoke.sh

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
