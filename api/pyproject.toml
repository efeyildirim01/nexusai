[project]
name = "nexusai-api"
version = "0.1.0"
description = "NexusAI API: multi-tenant business-intelligence backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "sqlglot>=25",
    "reportlab>=4.2",
    "anthropic>=0.40",
    "redis>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-openpyxl",
    "types-reportlab",
]
# Embedded PostgreSQL 16 binaries for running the test suite without Docker.
# CI does not install this: it uses the docker-compose Postgres service instead.
local = ["pgserver>=0.1.4"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "ASYNC", "PT"]
ignore = [
    "B008",  # FastAPI's Depends() in defaults is the intended idiom
    "S105",  # flags enum values and "bearer" as passwords; secrets come from settings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["S608"]
"app/ai/llm.py" = ["S608"]  # prompts that mention SELECT, not queries

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["pgserver.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "error",
    # Starlette's TestClient still works with httpx; the replacement package is not needed yet.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
